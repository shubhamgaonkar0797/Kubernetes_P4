apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-k8s-app
  labels:
    app: devops-k8s-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: devops-k8s-app
  template:
    metadata:
      labels:
        app: devops-k8s-app
    spec:
      containers:
        - name: devops-k8s-app
          image: devops-k8s-app:1.0
          imagePullPolicy: Never
          ports:
            - containerPort: 3000
